
name: 'texas_winter_storms'
version: '1.0.0'

profile: 'texas_winter_storms'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


flags:
  send_anonymous_usage_stats: false

models:
  texas_winter_storms:
    staging:
      +materialized: view
    prep:
      +materialized: table
    marts:
      +materialized: table

vars:
  # All four airports (DFW, IAH, AUS, SAT) are in US Central time.
  local_timezone: America/Chicago
  # Airports covered by the project; flights to or from other airports are only kept as counterparts.
  airports: ['DFW', 'IAH', 'AUS', 'SAT']