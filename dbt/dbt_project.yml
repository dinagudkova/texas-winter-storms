
name: 'texas_winter_storms'
version: '1.0.0'

profile: 'texas_winter_storms'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


flags:
  send_anonymous_usage_stats: false

models:
  texas_winter_storms:
    staging:
      +materialized: view
    prep:
      +materialized: table
    marts:
      +materialized: table

vars:
  local_timezone: America/Chicago
  airports: ['DFW', 'IAH', 'AUS', 'SAT']
  # window of mart_storm_timeline around the storm onset, hours
  timeline_hours_before: 48
  timeline_hours_after: 144