version: 2

models:
  - name: mart_flights_weather
    description: >
      One row per flight departing from DFW, IAH, AUS or SAT, with the weather at the
      origin airport in the hour of the scheduled departure and the storm period
      (before / storm / after) of the event whose data window contains the flight.
    columns:
      - name: flight_id
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Storm event whose data window contains the flight date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('storm_events')
                field: event_id
      - name: storm_period
        data_tests:
          - accepted_values:
              arguments:
                values: ['before', 'storm', 'after']
      - name: weather_hour_id
        description: >
          Matching hour in prep_weather_hourly. NULL would mean the hour grid does not
          cover the departure time.
        data_tests:
          - not_null
      - name: has_weather_report
        description: False when no METAR was issued in that hour; weather columns are then NULL.

  - name: mart_airport_hourly
    description: >
      One row per airport and local hour with scheduled departures, cancellations by reason,
      delays and the weather of that hour. Basis for storm timing metrics: when cancellations
      started relative to winter precipitation and how fast operations recovered.
    columns:
      - name: airport_hour_id
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_tests:
          - not_null
      - name: scheduled_departures
        description: Departures scheduled in this hour, including cancelled ones.
      - name: cancellation_rate
        description: cancelled / scheduled_departures. NULL when nothing was scheduled.
      - name: delay_15_rate
        description: Share of operated departures delayed 15+ minutes. NULL when nothing operated.