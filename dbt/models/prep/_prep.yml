version: 2

models:
  - name: prep_weather_hourly
    description: >
      One row per airport and local hour (US Central time) for every month with data.
      Weather phenomena are parsed from METAR codes; a phenomenon counts for the hour
      if any report of the hour mentions it. Codes in the vicinity (VC), blowing (BL)
      and drifting (DR) are ignored. Hours without reports are kept with has_report = false.
    columns:
      - name: weather_hour_id
        description: Hash of airport_code and weather_hour.
        data_tests:
          - unique
          - not_null
      - name: airport_code
        data_tests:
          - not_null
      - name: weather_hour
        description: >
          Start of the local hour. Reports are shifted by 7 minutes before truncating,
          so the routine report at 10:53 belongs to the hour 11:00.
        data_tests:
          - not_null
      - name: precip_mm
        description: Precipitation over the hour from the routine report only, mm.
      - name: has_winter_precip
        description: Freezing rain or drizzle, ice pellets or snow during the hour.
      - name: weather_group
        description: >
          Most disruptive phenomenon of the hour, in this order: freezing_rain, ice_pellets,
          snow, rain, fog, none. NULL when the hour has no reports.
        data_tests:
          - accepted_values:
              arguments:
                values: ['freezing_rain', 'ice_pellets', 'snow', 'rain', 'fog', 'none']

  - name: prep_flights
    description: >
      One row per scheduled flight with local timestamps. scheduled_dep_hour is the key
      for joining weather at the origin airport; scheduled_arr_ts is filled only for
      arrivals at the project airports.
    columns:
      - name: flight_id
        data_tests:
          - unique
          - not_null
      - name: scheduled_dep_ts
        description: Scheduled departure, origin local time. '2400' is midnight at the end of flight_date.
        data_tests:
          - not_null
      - name: actual_dep_ts
        description: Scheduled departure plus departure delay. NULL for cancelled flights.
      - name: scheduled_arr_ts
        description: Scheduled arrival in US Central time, only for arrivals at DFW, IAH, AUS or SAT.
      - name: is_departure
        description: Origin is one of the project airports.
      - name: is_arrival
        description: Destination is one of the project airports.