version: 2

seeds:
  - name: storm_events
    description: >
      Storm events and their time windows. Keep in sync with config/project.yml.
      data_start/data_end: the whole downloaded period; storm_start/storm_end: the storm
      itself, both dates inclusive (local time).
    config:
      column_types:
        data_start: date
        data_end: date
        storm_start: date
        storm_end: date
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
  - name: airline_groups
    description: >
      Operating carrier → marketing brand. BTS reports the operating carrier, so regional
      flights appear under their own codes; carriers flying for one brand are grouped with it.
      Carriers not listed here (multi-brand regionals such as SkyWest, Republic and Mesa,
      and smaller airlines) are grouped as 'Other' in the marts.
    columns:
      - name: airline_code
        data_tests:
          - unique
          - not_null
      - name: airline_group
        data_tests:
          - not_null
